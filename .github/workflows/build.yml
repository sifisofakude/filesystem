name: Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  build-jvm:
    if: "!contains(github.event.head_commit.message, '[skip jvm]')"
    name: JVM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew jvmTest

  build-android:
    if: "!contains(github.event.head_commit.message, '[skip android]')"
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
  
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
  
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
  
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
  
          ls -l /dev/kvm
  
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew connectedAndroidDeviceTest

  build-ios-targets:
    if: "!contains(github.event.head_commit.message, '[skip ios]')"
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build and Test Apple Targets
        run: |
          ./gradlew iosSimulatorArm64Test
          
  maven-publish-test:
    name: Maven Publish Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Maven Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          ./gradlew publish

      - name: Remove Maven metadata
        run: |
          find build/central-staging \
            \( -name "maven-metadata.xml" \
            -o -name "maven-metadata-local.xml" \) \
            -print -delete

      - name: Generate docs
        run: |
          ./gradlew dokkaGenerate --stacktrace
          # find build -type f | grep -i javadoc

      - name: Generate Maven checksums
        run: |
          find build/central-staging -type f \
            ! -name "*.md5" \
            ! -name "*.sha1" \
            ! -name "*.sha256" \
            ! -name "*.sha512" \
            ! -name "*.asc" \
            -print0 |
          while IFS= read -r -d '' file; do
            printf '%s' "$(md5 -q "$file")" > "$file.md5"
            shasum -a 1 "$file" | awk '{print $1}' > "$file.sha1"
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
            shasum -a 512 "$file" | awk '{print $1}' > "$file.sha512"
          done

      - name: Create Central bundle
        run: |
          cd build/central-staging
          zip -r ../central-bundle.zip .

      - name: Upload to Central Publisher
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(printf '%s:%s' \
            "$SONATYPE_USERNAME" \
            "$SONATYPE_PASSWORD" |
            base64 |
            tr -d '\n')

          curl --fail-with-body \
            --silent \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"
