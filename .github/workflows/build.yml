name: Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  build-jvm-android:
    if: "!contains(github.event.head_commit.message, '[skip jvm]')"
    name: JVM / Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew jvmTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "platform-tools" "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Check emulator
        run: |
          which emulator
          emulator -version
          emulator -accel-check

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n ci-emulator \
            -k "system-images;android-35;google_apis;x86_64" \
            --force

      - name: Start emulator
        run: |
          nohup emulator @ci-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          echo $! > emulator.pid

      - name: Wait for emulator
        run: |
          adb wait-for-device

          for i in $(seq 1 60); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Boot status: $boot"

            if [ "$boot" = "1" ]; then
              echo "Emulator is ready"
              break
            fi

            sleep 5
          done

          adb devices -l
          adb shell getprop ro.product.model

      - name: Emulator log
        if: always()
        run: |
          cat emulator.log || true

  build-apple-targets:
    if: "!contains(github.event.head_commit.message, '[skip apple]')"
    name: Apple / Kotlin Native
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build and Test Apple Targets
        run: |
          ./gradlew iosSimulatorArm64Test
