name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  maven-publish:
    name: Publish To Maven Central
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          ./gradlew publish

      - name: Remove Maven metadata
        run: |
          find build/central-staging \
            \( -name "maven-metadata.xml" \
            -o -name "maven-metadata-local.xml" \) \
            -print -delete

      - name: Verify Javadoc artifacts
        run: |
          echo "Javadoc artifacts:"
          find build/central-staging \
            -type f \
            -name "*-javadoc.jar" \
            -print

      - name: Generate Maven checksums
        run: |
          find build/central-staging -type f \
            ! -name "*.md5" \
            ! -name "*.sha1" \
            ! -name "*.sha256" \
            ! -name "*.sha512" \
            ! -name "*.asc" \
            -print0 |
          while IFS= read -r -d '' file; do
            printf '%s' "$(md5 -q "$file")" > "$file.md5"
            shasum -a 1 "$file" | awk '{print $1}' > "$file.sha1"
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
            shasum -a 512 "$file" | awk '{print $1}' > "$file.sha512"
          done

      - name: Create Central bundle
        run: |
          cd build/central-staging
          zip -r ../central-bundle.zip .

      - name: Upload to Central Publisher
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(printf '%s:%s' \
            "$SONATYPE_USERNAME" \
            "$SONATYPE_PASSWORD" |
            base64 |
            tr -d '\n')

          curl --fail-with-body \
            --silent \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREVIOUS_TAG=$(gh release list \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi

          get_commits() {
            git log "$RANGE" --format='%h|%s' |
              sed -E 's/\[skip [^]]+\]//g; s/  +/ /g; s/^ //; s/ $//' |
              awk -F'|' '!seen[tolower($2)]++'
          }

          COMMITS=$(get_commits)

          NOTES=""

          add_section() {
            local title="$1"
            local pattern="$2"

            local section
            section=$(printf '%s\n' "$COMMITS" |
              grep -E "$pattern" || true)

            if [ -n "$section" ]; then
              NOTES+=$'\n'"## ${title}"$'\n'

              while IFS='|' read -r hash subject; do
                NOTES+="- ${subject} (${hash})"$'\n'
              done <<< "$section"
            fi
          }

          add_section "Features" '^[^|]+\|feat(\([^)]*\))?:'
          add_section "Fixes" '^[^|]+\|fix(\([^)]*\))?:'
          add_section "Improvements" '^[^|]+\|improve(\([^)]*\))?:'

          OTHER=$(printf '%s\n' "$COMMITS" |
            grep -Ev '^[^|]+\|(feat|fix|improve)(\([^)]*\))?:' || true)

          if [ -n "$OTHER" ]; then
            NOTES+=$'\n'"## Other Changes"$'\n'

            while IFS='|' read -r hash subject; do
              NOTES+="- ${subject} (${hash})"$'\n'
            done <<< "$OTHER"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="No changes recorded."
          fi

          gh release create "$CURRENT_TAG" \
            --title "$CURRENT_TAG" \
            --notes "$NOTES"
